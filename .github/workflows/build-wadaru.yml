name: Build WadaRu Store Release

on:
  push:
    branches: [ "wadaru-store-release" ]
    paths:
      - "source-parts/**"
      - "source-overrides/**"
      - ".github/workflows/build-wadaru.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore and validate production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          cat source-parts/part-* > /tmp/wadaru-source.tgz.b64
          base64 -d /tmp/wadaru-source.tgz.b64 > /tmp/wadaru-source.tgz
          echo "Archive SHA-256:"
          sha256sum /tmp/wadaru-source.tgz
          tar -tzf /tmp/wadaru-source.tgz >/dev/null
          tar -xzf /tmp/wadaru-source.tgz -C project
          python3 source-overrides/apply.py project
          python3 project/tools/validate_data.py
          node --check project/app/src/main/assets/app.js
          node - <<'NODE'
          const fs = require('fs');
          global.window = {};
          eval(fs.readFileSync('project/app/src/main/assets/appdata.js','utf8'));
          const D = window.WADA_DATA?.palettes;
          if (!Array.isArray(D) || D.length !== 581) throw new Error('Expected 581 palettes');

          const app = fs.readFileSync('project/app/src/main/assets/app.js','utf8');
          const start = app.indexOf('function paintHTML(p)');
          const end = app.indexOf('\nfunction heart', start);
          if (start < 0 || end < 0) throw new Error('paintHTML not found');
          const fnSource = app.slice(start, end);
          const paintHTML = new Function(fnSource + '; return paintHTML;')();

          let maxColors = 0;
          for (const p of D) {
            const expected = p.colors.map(c => String(c.hex).toUpperCase());
            maxColors = Math.max(maxColors, expected.length);
            if (expected.length < 2 || expected.length > 9) {
              throw new Error(p.id + ': unexpected color count ' + expected.length);
            }
            for (const hex of expected) {
              if (!/^#[0-9A-F]{6}$/.test(hex)) throw new Error(p.id + ': invalid HEX ' + hex);
            }
            const html = paintHTML(p);
            const actual = [...html.matchAll(/<i class="paint"[^>]*style="background:(#[0-9A-Fa-f]{6})"/g)]
              .map(m => m[1].toUpperCase());
            if (actual.length !== expected.length || actual.some((hex, i) => hex !== expected[i])) {
              throw new Error(p.id + ': cover mismatch: ' + JSON.stringify({expected, actual}));
            }
          }
          console.log('Cover validation passed:', D.length, 'palettes; max colors =', maxColors);
          NODE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Lint release
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean lintRelease --stacktrace

      - name: Build release APK and AAB
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Prepare release payload
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          find project/app/build/outputs -maxdepth 5 -type f -print | sort

          AAB="$(find project/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          APK="$(find project/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$AAB" && test -f "$AAB"
          test -n "$APK" && test -f "$APK"

          cp "$AAB" out/WadaRu-1.5.6-release-unsigned.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK" out/WadaRu-1.5.6-release-aligned-unsigned.apk

          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools/36.0.0" -type f -name 'apksigner*.jar' -print -quit || true)"
          if [ -n "$APKSIGNER_JAR" ]; then
            cp "$APKSIGNER_JAR" out/apksigner.jar
          fi

          cp project/app/build/reports/lint-results-release.html out/lint-results-release.html || true
          cp project/app/build/reports/lint-results-release.xml out/lint-results-release.xml || true
          cp project/docs/PRIVACY_POLICY_RU.html out/privacy-policy-ru.html
          cp project/docs/PRIVACY_POLICY_RU.md out/privacy-policy-ru.md
          cp -r project/store-listing out/store-listing
          (cd project && zip -qr ../out/WadaRu-1.5.6-source.zip . -x 'app/build/*' '.gradle/*')

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/WadaRu-1.5.6-release-aligned-unsigned.apk > out/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions out/WadaRu-1.5.6-release-aligned-unsigned.apk > out/apk-permissions.txt

          cat out/apk-badging.txt
          cat out/apk-permissions.txt

          grep -q "package: name='com.dmitry.wadaru'.*versionCode='11'.*versionName='1.5.6'" out/apk-badging.txt
          grep -q "minSdkVersion:'26'" out/apk-badging.txt
          grep -q "targetSdkVersion:'36'" out/apk-badging.txt
          ! grep -qi "android.permission.INTERNET" out/apk-permissions.txt

          # Startup-compatibility regression checks.
          unzip -p out/WadaRu-1.5.6-release-aligned-unsigned.apk classes.dex > /tmp/classes.dex
          strings /tmp/classes.dex | grep -q "Lcom/dmitry/wadaru/MainActivity;"
          strings /tmp/classes.dex | grep -q "Lcom/dmitry/wadaru/Api33Back;"
          ! strings /tmp/classes.dex | grep -q "Lcom/dmitry/wadaru/Api29Window;"
          ! strings /tmp/classes.dex | grep -q "Lcom/dmitry/wadaru/Api30Window;"
          ! grep -q "android.window." project/app/src/main/java/com/dmitry/wadaru/MainActivity.java
          ! grep -q "WindowInsetsController" project/app/src/main/java/com/dmitry/wadaru/MainActivity.java
          ! grep -q "Api30Window" project/app/src/main/java/com/dmitry/wadaru/MainActivity.java
          ! grep -q "Api29Window" project/app/src/main/java/com/dmitry/wadaru/MainActivity.java
          ! grep -q "androidx.activity" project/app/build.gradle.kts

          # 1.5.6 UX regression checks.
          grep -q "function paintHTML(p){const colors=p.colors.map(c=>c.hex),mode=" project/app/src/main/assets/app.js
          grep -q "Цвета Сандзо Вада" project/app/src/main/assets/app.js
          grep -q 'id="filterButton"' project/app/src/main/assets/app.js
          grep -q 'data-tab="catalog"' project/app/src/main/assets/app.js
          grep -q ">Главная</button>" project/app/src/main/assets/app.js
          grep -q ">Избранное</button>" project/app/src/main/assets/app.js
          grep -q ">Настройки</button>" project/app/src/main/assets/app.js
          grep -q "category-scroll" project/app/src/main/assets/app.js
          grep -q 'data-theme-choice="dark"' project/app/src/main/assets/app.js
          grep -q 'data-theme-choice="light"' project/app/src/main/assets/app.js
          grep -q "wada-theme" project/app/src/main/assets/app.js
          ! grep -q 'id="filtersNav"' project/app/src/main/assets/app.js
          ! grep -q "прокручивается отдельно" project/app/src/main/assets/app.js
          ! grep -q "581 сочетание · два тома · полностью офлайн" project/app/src/main/assets/app.js
          ! grep -q 'data-tab="categories"' project/app/src/main/assets/app.js
          ! grep -q 'class="filters"' project/app/src/main/assets/app.js

          (cd out && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload release build payload
        uses: actions/upload-artifact@v4
        with:
          name: WadaRu-1.5.6-store-build
          path: out/
          if-no-files-found: error
          retention-days: 30
